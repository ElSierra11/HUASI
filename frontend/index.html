<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HUASI" />
    
    <!-- Favicon e Iconos Oficiales HUASI -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="shortcut icon" href="/favicon.ico?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.json?v=4" />
    
    <meta name="description" content="HUASI — Hospedaje Solidario: Red autogestionada y voluntaria de alojamiento universitario para estudiantes y profesores." />
    <title>HUASI — Hospedaje Solidario Universitario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      /* ==================== SPLASH SCREEN OFICIAL HUASI ==================== */
      #splash-screen {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: radial-gradient(circle at 50% 40%, #0d7c3d 0%, #064e3b 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999999;
        user-select: none;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        opacity: 1;
        visibility: visible;
        transform: scale(1);
        transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1), transform 400ms cubic-bezier(0.4, 0, 0.2, 1), visibility 400ms;
        will-change: opacity, transform;
      }
      
      #splash-screen.fade-out {
        opacity: 0;
        transform: scale(1.03);
        visibility: hidden;
        pointer-events: none;
      }

      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        max-width: 360px;
        width: 100%;
        box-sizing: border-box;
        animation: splashCardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .splash-icon-wrapper {
        width: 104px;
        height: 104px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4);
        margin-bottom: 22px;
        position: relative;
        flex-shrink: 0;
      }

      .splash-icon-wrapper img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.25));
      }

      .splash-title {
        font-family: 'Sora', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 2.3rem;
        color: #ffffff;
        letter-spacing: 0.05em;
        margin: 0;
        line-height: 1.1;
        text-transform: uppercase;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      }

      .splash-subtitle {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 0.98rem;
        color: rgba(255, 255, 255, 0.95);
        margin: 8px 0 0 0;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .splash-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 16px;
        background: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 5px 16px;
        border-radius: 9999px;
        font-size: 0.72rem;
        color: #a7f3d0;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }

      .splash-bar-container {
        width: 130px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 9999px;
        margin-top: 28px;
        overflow: hidden;
        position: relative;
      }

      .splash-bar-progress {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: #ffffff;
        border-radius: 9999px;
        animation: splashBarAnim 1.3s ease-in-out infinite;
      }

      @keyframes splashCardEnter {
        0% { opacity: 0; transform: scale(0.9) translateY(16px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      @keyframes splashBarAnim {
        0% { left: -45%; width: 35%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 35%; }
      }

      .splash-logos-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 32px;
        gap: 8px;
      }

      .splash-logos-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 9px 20px;
        border-radius: 22px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22), inset 0 1px 1px rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.85);
      }

      .splash-logo-ucc {
        height: 28px;
        width: auto;
        max-width: 105px;
        object-fit: contain;
        display: block;
      }

      .splash-logo-territorios {
        height: 34px;
        width: auto;
        max-width: 38px;
        object-fit: contain;
        display: block;
      }

      .splash-logo-indesco {
        height: 26px;
        width: auto;
        max-width: 105px;
        object-fit: contain;
        display: block;
      }

      .splash-logo-divider {
        width: 1px;
        height: 22px;
        background: rgba(0, 0, 0, 0.12);
      }

      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="bg-ucc-bg text-ucc-text font-body antialiased">
    <!-- Pantalla de Inicio / Splash Screen Oficial HUASI -->
    <div id="splash-screen">
      <div class="splash-card">
        <div class="splash-icon-wrapper">
          <img src="/huasi-monograma.png?v=5" alt="HUASI Monograma" />
        </div>
        <h1 class="splash-title">HUASI</h1>
        <p class="splash-subtitle">Hospedaje Solidario Universitario</p>
        <div class="splash-pill">
          <span>RED SOLIDARIA &bull; INDESCO &bull; UCC</span>
        </div>
        <div class="splash-bar-container">
          <div class="splash-bar-progress"></div>
        </div>
        <div class="splash-logos-container">
          <div class="splash-logos-pill">
            <img src="/ucc_logo.png" alt="Universidad Cooperativa de Colombia" class="splash-logo-ucc" />
            <div class="splash-logo-divider"></div>
            <img src="/territorios_solidarios.png" alt="Territorios Solidarios" class="splash-logo-territorios" />
            <div class="splash-logo-divider"></div>
            <img src="/indesco.png" alt="INDESCO" class="splash-logo-indesco" />
          </div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        var splashHidden = false;
        function hideSplashScreen() {
          if (splashHidden) return;
          splashHidden = true;
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() {
              if (splash && splash.parentNode) {
                splash.parentNode.removeChild(splash);
              }
            }, 450);
          }
        }

        // Permitir que la pantalla inicial sea apreciada durante al menos 850ms
        window.addEventListener('load', function() {
          setTimeout(hideSplashScreen, 850);
        });

        // Fallback de seguridad por si tarda la conexión
        setTimeout(hideSplashScreen, 2800);
      })();
    </script>
  </body>
</html>
