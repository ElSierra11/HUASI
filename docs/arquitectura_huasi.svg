<svg xmlns="http://www.w3.org/2000/svg" width="780" height="910" viewBox="0 0 780 910" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1F3A5F"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #1F3A5F; stroke-width: 1.6; }
      .head { fill: #DCE6F2; stroke: #1F3A5F; stroke-width: 1.6; }
      .title { font-size: 16px; font-weight: bold; fill: #1F3A5F; text-anchor: middle; letter-spacing: 0.5px; }
      .tech { font-size: 15px; font-weight: bold; fill: #222222; text-anchor: middle; }
      .item { font-size: 14px; fill: #222222; text-anchor: middle; }
      .flow { stroke: #1F3A5F; stroke-width: 1.8; fill: none; }
      .label { font-size: 13px; font-style: italic; fill: #1F3A5F; }
      .caption { font-size: 16px; fill: #222222; text-anchor: middle; }
    </style>
  </defs>

  <rect width="780" height="910" fill="#FFFFFF"/>

  <!-- ================= USUARIOS ================= -->
  <rect class="box" x="160" y="70" width="460" height="110"/>
  <rect class="head" x="160" y="70" width="460" height="40"/>
  <text class="title" x="390" y="96">USUARIOS</text>
  <text class="item" x="390" y="140">Huésped / Anfitrión</text>
  <text class="item" x="390" y="164">Administrador</text>

  <line class="flow" x1="390" y1="180" x2="390" y2="228" marker-end="url(#arrow)"/>

  <!-- ================= APLICACIÓN WEB ================= -->
  <rect class="box" x="160" y="230" width="460" height="120"/>
  <rect class="head" x="160" y="230" width="460" height="40"/>
  <text class="title" x="390" y="256">APLICACIÓN WEB</text>
  <text class="tech" x="390" y="302">React.js + Vite</text>
  <text class="item" x="390" y="332">Formularios, vistas y navegación</text>

  <line class="flow" x1="390" y1="350" x2="390" y2="418" marker-end="url(#arrow)"/>
  <text class="label" x="402" y="389">Solicitudes HTTP/REST</text>

  <!-- ================= SERVIDOR ================= -->
  <rect class="box" x="160" y="420" width="460" height="200"/>
  <rect class="head" x="160" y="420" width="460" height="40"/>
  <text class="title" x="390" y="446">SERVIDOR</text>
  <text class="tech" x="390" y="492">Node.js + Express</text>
  <text class="item" x="390" y="525">Usuarios y autenticación</text>
  <text class="item" x="390" y="549">Alojamientos</text>
  <text class="item" x="390" y="573">Solicitudes de estadía</text>
  <text class="item" x="390" y="597">Validación y administración</text>

  <line class="flow" x1="390" y1="620" x2="390" y2="668" marker-end="url(#arrow)"/>

  <!-- ================= BASE DE DATOS ================= -->
  <rect class="box" x="160" y="670" width="460" height="150"/>
  <rect class="head" x="160" y="670" width="460" height="40"/>
  <text class="title" x="390" y="696">BASE DE DATOS</text>
  <text class="tech" x="390" y="742">PostgreSQL</text>
  <text class="item" x="390" y="772">Usuarios, alojamientos,</text>
  <text class="item" x="390" y="796">solicitudes y registros</text>

  <!-- Pie de figura -->
  <text class="caption" x="390" y="870"><tspan font-weight="bold">Figura X.</tspan> Arquitectura general de software de HUASI</text>
</svg>
