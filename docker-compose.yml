version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: stayu_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stayu
    ports:
      - "5431:5432"
    volumes:
      - stayu_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  stayu_data:
